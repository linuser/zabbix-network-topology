# Dieselben Gates wie .gitlab-ci.yml — hier, damit ein Beitragender sie SIEHT.
#
# ANLASS
# ------
# Die Pipeline dieses Projekts laeuft auf einem selbstgehosteten GitLab. Wer auf
# GitHub einen Pull Request oeffnet, bekam deshalb: nichts. Keine Haken, keine
# Kreuze, keine Rueckmeldung — bei einem Projekt, dessen erklaerte Haltung
# "ein kaputtes Gate meldet sich nicht" ist, war das die groesste Luecke davon.
# Aufgefallen an PR #5, einem sauberen Beitrag von aussen, der einen Tag lang
# ohne jedes Signal dastand.
#
# Bewusst NICHT hier: clean-install-smoke. Der Job faehrt zwei Container hoch,
# dauert Minuten und ist auch auf GitLab manuell — ein Gate, das jede Pipeline
# rot faerbt, schaut sich nach zwei Wochen niemand mehr an.
#
# Wer hier oder in .gitlab-ci.yml ein Gate ergaenzt, ergaenzt es in BEIDEN
# Dateien. 'npm run ci:pipeline' prueft das und faellt sonst — zwei Listen sind
# zwei Stellen, die auseinanderlaufen.

name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: php-lint + unit-tests
    runs-on: ubuntu-latest
    container: php:8.2-cli-alpine
    steps:
      # git vor dem Checkout: sonst weicht actions/checkout auf den
      # API-TARBALL aus, und der wird mit `git archive` erzeugt.
      #
      # Das ist kein theoretisches Risiko, sondern hat sechs Laeufe lang die
      # Pipeline rot gefaerbt. Eine .gitattributes mit export-ignore auf
      # tests/ und tools/ liess `git archive` genau diese Verzeichnisse
      # weglassen — und damit fehlten sie auch im CI-Checkout. Der Job lief
      # trotzdem los, php -l fand die vorhandenen Dateien, und erst die
      # Testschleife fiel auf die Nase, weil `tests/*Test.php` auf nichts
      # passte und die Shell das Muster woertlich weiterreichte:
      #
      #     --- tests/*Test.php
      #     Could not open input file: tests/*Test.php
      #
      # Lokal waren alle dreizehn Gates gruen, weil dort das ganze Repository
      # liegt. Die .gitattributes ist inzwischen weg, aber die Zeile bleibt:
      # sie macht den Checkout zu einem echten Klon statt zu einem Download,
      # und sie schuetzt vor derselben Falle, falls jemand export-ignore
      # wieder einfuehrt.
      #
      # Die beiden anderen Jobs laufen auf ubuntu-latest OHNE Container, dort
      # ist git vorhanden. Wer hier einen weiteren Container-Job ergaenzt,
      # braucht diese Zeile ebenfalls.
      - name: git (sonst kommt statt eines Klons nur ein Archiv)
        run: apk add --no-cache git
      - uses: actions/checkout@v4
      - name: php-lint
        run: find . -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: unit-tests
        run: for t in tests/*Test.php; do echo "--- $t"; php "$t" || exit 1; done

  node:
    name: eslint + parity + templates + package + layers + i18n + pipeline + bundle-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: eslint-dom-sinks
        run: npm run ci:eslint
      - name: parity
        run: node tools/check-parity.mjs
      - name: templates
        run: node tools/check-templates.mjs
      - name: package
        run: node tools/check-package.mjs
      - name: layers
        run: node tools/check-layers.mjs
      - name: i18n
        run: node tools/check-i18n.mjs
      - name: pipeline
        run: npm run ci:pipeline
      - name: npm-audit
        run: npm run ci:audit
      # Faengt, was php -l strukturell nicht kann: eine benutzte, aber nicht
      # importierte Zabbix-Klasse. Hat schon einmal eine Produktionsseite
      # weiss gemacht.
      - name: php-use
        run: npm run ci:php-use
      # Der wichtige: das Bundle ist eingecheckt und kann von den Quellmodulen
      # abweichen, wenn jemand den Build vergisst.
      - name: bundle-drift
        run: |
          npm run build
          git diff --exit-code -- assets/js/dist/nt-bundle.js

  shell:
    name: xss-tripwire + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: xss-tripwire
        run: bash tools/check-xss.sh --strict
      # shellcheck ist auf den GitHub-Runnern vorinstalliert; die Zeile faellt
      # sichtbar, falls sich das aendert, statt den Job still zu ueberspringen.
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { echo "shellcheck fehlt auf dem Runner"; exit 1; }
          shellcheck nt-install.sh nt-uninstall.sh deploy.sh tools/*.sh tools/clean-install-test/*.sh
