name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please don't file security issues here** — mail
        them confidentially instead, see [SECURITY.md](../blob/main/SECURITY.md).

        For **missing edges in the graph**, the vendor matrix in
        [LLDP-SETUP.md](../blob/main/LLDP-SETUP.md) is worth a look first: many
        devices simply don't hand out LLDP data over SNMP, and the guide names
        the three different things an empty result can mean.

  - type: textarea
    id: what
    attributes:
      label: What happens?
      description: And what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Monitoring → Network Topology for Zabbix
        2. select host group "…", Apply
        3. open the "…" tab
    validations:
      required: true

  - type: input
    id: module-version
    attributes:
      label: Module version
      description: Shown in the footer of the module page (e.g. 5.1.1)
    validations:
      required: true

  - type: input
    id: zabbix-version
    attributes:
      label: Zabbix version
      description: e.g. 7.4.12 or 7.0.28
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      description: "`php -v` on the frontend server"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Technical topology (graph)
        - Management wallboard
        - Table / items pivot
        - Geo map
        - Health / Stats / Compliance
        - Dashboard widget
        - Installation / deployment
        - Something else / not sure
    validations:
      required: true

  - type: input
    id: snmp-vendor
    attributes:
      label: SNMP vendor (only for missing edges)
      description: Vendor and model of the device that gets no edge
      placeholder: e.g. HPE Aruba 2530, Cisco C9200, MikroTik CRS326

  - type: textarea
    id: console
    attributes:
      label: Browser console (F12)
      description: Red error messages — helps with anything that doesn't render
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checked beforehand
      options:
        - label: Ran "Administration → General → Modules → Scan directory" after the update
        - label: Hard-reloaded the page once (Ctrl+F5 / ⌘⇧R) to rule out the browser cache
