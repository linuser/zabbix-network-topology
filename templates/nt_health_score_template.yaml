zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 79f31eeab03146229b1e019097fad672
      name: Templates
  templates:
    - uuid: b7e4d2c1a09f48e3b6d5c4a3f2e1d0c9
      template: 'NT Health Score'
      name: 'NT Health Score'
      description: |
        Receives the topology health score of the Network Topology module
        via zabbix_sender (tools/topo-change-sender.sh as a cron job - the
        same cron also pushes the topology changes).

        Score 0-100, same formula as the module's Health tab:
          100 - offline%*40 - stale%*15 - critical%*25 - unacked%*20
        per host group. Sent are the average across all groups
        (nt.health.score) and the worst group (nt.health.score.min).
      groups:
        - name: Templates
      items:
        - uuid: c8f5e3d2b1a04f9e8d7c6b5a4e3d2c1b
          name: 'NT: Health score (avg)'
          type: TRAP
          key: nt.health.score
          value_type: FLOAT
          history: 90d
          trends: 365d
          description: 'Average score across all host groups (0-100). Filled by the sender cron.'
          triggers:
            - uuid: 6b5dcbbdff304f75b34bb221a3056b07
              expression: 'last(/NT Health Score/nt.health.score)<70'
              name: 'Network health score low: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Topology health score below 70 - see the Health tab of the Network Topology module for details (offline/stale/critical/unacked per group).'
        - uuid: 7e6952ab23da425f8950443f5b8a7c11
          name: 'NT: Health score (worst group)'
          type: TRAP
          key: nt.health.score.min
          value_type: FLOAT
          history: 90d
          trends: 365d
          description: 'Score of the worst host group (0-100) - add your own triggers if needed (e.g. <40 = HIGH).'
