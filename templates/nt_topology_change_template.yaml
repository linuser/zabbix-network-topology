zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 79f31eeab03146229b1e019097fad672
      name: Templates
  templates:
    - uuid: 3f1c2a9be4d94b0f8a7c6d5e4f3a2b1c
      template: 'NT Topology Change'
      name: 'NT Topology Change'
      description: |
        Receives topology changes from the Network Topology module via
        zabbix_sender (tools/topo-change-sender.sh as a cron job).

        The items are trappers - the sender pushes:
          nt.topo.changes       number of new + vanished LLDP/CDP edges
                                since the last poll
          nt.topo.changes.text  human-readable list ("+ A <-> B; - C <-> D")

        The trigger fires on changes > 0 and recovers on the next 0 poll,
        so every re-cabling becomes an event of its own.
      groups:
        - name: Templates
      items:
        - uuid: 5cb6534ac4a54682985e3fbb53335f51
          name: 'NT: Topology changes since last poll'
          type: TRAP
          key: nt.topo.changes
          value_type: UNSIGNED
          history: 31d
          trends: 365d
          description: 'Number of new + vanished edges since the last sender poll.'
          triggers:
            - uuid: e28354047fcc4533bfff035e7acfd185
              expression: 'last(/NT Topology Change/nt.topo.changes)>0'
              name: 'Network topology changed: {ITEM.LASTVALUE1} link(s)'
              priority: WARNING
              description: 'The LLDP/CDP topology has changed - see the text item nt.topo.changes.text for details.'
              manual_close: 'YES'
        - uuid: c0d63dae79cd4191b632ec81e64886ce
          name: 'NT: Topology change details'
          type: TRAP
          key: nt.topo.changes.text
          value_type: TEXT
          history: 31d
          trends: '0'
          description: 'Human-readable list of the changes ("+ A <-> B; - C <-> D"), "-" if none.'
