zabbix_export:
  # ACHTUNG: Diese Datei laesst sich NUR mit Zabbix 8.0 oder neuer importieren.
  #
  # Eigenstaendige Dashboards kennt der Zabbix-Import erst ab 8.0. Gegen die
  # Validatoren von 7.0, 7.2 und 7.4 nachgemessen — alle drei antworten:
  #
  #   Invalid tag "/": unexpected tag "dashboards".
  #
  # Und in der UI dieser Versionen gibt es weder einen Import- noch einen
  # Export-Knopf fuer Dashboards. Wer 7.0 LTS oder 7.4 faehrt, baut das
  # Dashboard von Hand nach; die Anordnung unten ist die Vorlage dafuer.
  # Details in README.md daneben.
  #
  # Kein uuid: der Zabbix-8-Validator weist es auf Dashboard-Ebene ab
  # ("unexpected tag uuid"). Templates brauchen eines, Dashboards nicht.
  version: '8.0'
  dashboards:
    - name: 'Network Topology — Overview'
      display_period: '30'
      auto_start: 'YES'
      pages:
        - name: 'Overview'
          display_period: '0'
          widgets:
            # Raster ist 72 Spalten breit. Links die Karte, rechts die beiden
            # Kennzahlen-Kacheln uebereinander, unten Tabelle und Items.
            #
            # KEINE Hostgruppe vorbelegt: sonst verwiese das Dashboard nach dem
            # Import auf eine Gruppe, die es auf der Zielinstallation nicht
            # gibt. Die Widgets zeigen ohne Auswahl einen Hinweis, ein Klick auf
            # "Edit" setzt sie.
            - type: network_topology_widget
              name: 'Topology'
              'y': '0'
              x: '0'
              width: '48'
              height: '10'
              fields:
                - type: INTEGER
                  name: view_mode
                  value: '0'          # 0 = Technical, 1 = Management
                - type: INTEGER
                  name: show_lldp
                  value: '1'
                - type: INTEGER
                  name: hide_offline
                  value: '0'

            - type: network_topology_kpi_widget
              name: 'KPI'
              'y': '0'
              x: '48'
              width: '24'
              height: '5'
              fields:
                - type: INTEGER
                  name: display
                  value: '0'          # 0 = Ring, 1 = Tiles

            - type: network_topology_health_widget
              name: 'Health Score'
              'y': '5'
              x: '48'
              width: '24'
              height: '5'
              fields:
                - type: INTEGER
                  name: worst_first
                  value: '1'
                - type: INTEGER
                  name: max_groups
                  value: '10'
                - type: INTEGER
                  name: show_legend
                  value: '1'

            - type: network_topology_table_widget
              name: 'Table'
              'y': '10'
              x: '0'
              width: '40'
              height: '8'
              fields:
                - type: INTEGER
                  name: hide_offline
                  value: '0'
                - type: INTEGER
                  name: problems_only
                  value: '0'
                - type: INTEGER
                  name: max_rows
                  value: '50'

            - type: network_topology_items_widget
              name: 'Items'
              'y': '10'
              x: '40'
              width: '32'
              height: '8'
              fields:
                # Ein Muster, das die Standard-Linux-Templates liefern. Passt es
                # nicht, zeigt das Widget "keine Items" — kein Fehler, sondern
                # eine andere Template-Welt (SNMP-Switches und Windows haben
                # andere Keys, siehe README des Moduls).
                - type: STRING
                  name: pattern
                  value: 'system.cpu.util'
                - type: INTEGER
                  name: hide_empty
                  value: '1'
                - type: INTEGER
                  name: max_rows
                  value: '25'
