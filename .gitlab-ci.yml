# CI fuer "Network Topology for Zabbix"  (Code-Review §14 + §11-Danach-Liste)
#
# Zwoelf Jobs ueber drei Stages, die genau die Regressionen abfangen, die uns real
# passiert sind. Wer hier einen Job ergaenzt, prueft die stages-Liste mit —
# 'npm run ci:pipeline' tut das lokal und faengt genau diesen Fehler:
#
#   php-lint       — Syntaxfehler in Actions/Views/Widgets/Module.php
#   xss-tripwire   — tools/check-xss.sh --strict (innerHTML-Sinks ohne esc())
#   shellcheck     — nt-install.sh, nt-uninstall.sh, deploy.sh, tools/*.sh
#   npm-audit      — verwundbare Dev-Dependencies (z.B. der alte esbuild-Fund)
#   bundle-drift   — DER wichtige: assets/js/dist/nt-bundle.js ist eingecheckt und
#                    kann von den Quellmodulen abweichen, wenn jemand den Build
#                    vergisst. Der Job baut frisch und schlaegt fehl, sobald sich
#                    das Ergebnis vom eingecheckten Bundle unterscheidet.
#
# Hinweis: "npm run build" erzeugt bewusst KEINE Source-Map (Release-Build), damit
# der Drift-Vergleich stabil bleibt und keine ~1 MB .map ausgeliefert wird.

# Eine explizite stages-Liste ERSETZT GitLabs Defaults (.pre/build/test/deploy/
# .post). Wer hier eine Stage vergisst, die ein Job benutzt, bekommt keinen
# uebersprungenen Job, sondern eine ungueltige Pipeline — GitLab weist sie
# komplett ab. Genau das ist ab 6347808 passiert: der parity-Job kam mit
# "stage: test" dazu, test stand aber nicht in dieser Liste. Ergebnis: 32
# Commits ohne eine einzige Pipeline, ohne dass irgendwo etwas rot geworden
# waere. Wer hier einen Job ergaenzt, prueft die Liste mit.
stages:
  - lint
  - test
  - build

default:
  interruptible: true
  # Der Runner, der dieses Projekt bedient, ist tag-beschraenkt: er nimmt nur
  # Jobs mit hugo, deploy oder nt. Untagged Jobs bleiben bei ihm liegen, bis
  # GitLab sie mit "stuck in pending state with no matching runners" abraeumt —
  # genau das ist in Pipeline #422 passiert, sechsmal, ohne ein einziges
  # Job-Log.
  #
  # 'nt' wurde dem Runner eigens hinzugefuegt, statt bei ihm "Run untagged
  # jobs" einzuschalten: er bedient 14 weitere Projekte, und ein global
  # geoeffneter Runner haette dort untagged Jobs angezogen, die bisher liegen
  # bleiben. Ein zusaetzlicher Tag ist additiv und aendert fuer die anderen
  # nichts.
  tags:
    - nt

php-lint:
  stage: lint
  image: php:8.2-cli-alpine
  script:
    - find . -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

# Unit-Tests der aus Data.php ausgelagerten, reinen Klassen (Review §6). Sie
# brauchen weder DB noch Session noch Zabbix — genau deshalb wurden sie
# ausgelagert. Laeuft im nackten php-cli-Image.
unit-tests:
  stage: lint
  image: php:8.2-cli-alpine
  script:
    - for t in tests/*Test.php; do echo "--- $t"; php "$t" || exit 1; done

xss-tripwire:
  stage: lint
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash grep
  script:
    - bash tools/check-xss.sh --strict

# Schaerferer Bruder des Tripwires: no-unsanitized wertet den Ausdruck aus statt
# zu greppen. Der Bestand (~76 Sinks aus esc()-Buildern) ist in
# eslint-suppressions.json gebaselined — dieser Job faellt also genau dann, wenn
# NEUER unsicherer Code dazukommt.
eslint-dom-sinks:
  stage: lint
  image: node:22-alpine
  script:
    - npm ci
    - npm run ci:eslint

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck nt-install.sh nt-uninstall.sh deploy.sh tools/*.sh tools/clean-install-test/*.sh

npm-audit:
  stage: lint
  image: node:22-alpine
  script:
    - npm ci
    - npm run ci:audit

bundle-drift:
  stage: build
  image: node:22-alpine
  before_script:
    - apk add --no-cache git
  script:
    - npm ci
    - npm run build
    # Exit 1, wenn das eingecheckte Bundle nicht zu den Quellmodulen passt.
    - git diff --exit-code -- assets/js/dist/nt-bundle.js

# Bewacht die zwei bewussten Duplikate: die Health-Score-Formel (Hauptmodul vs.
# Widget) und den geteilten Datenzugriff, der in vier Widget-Dateien liegt. Die
# Widget-Loader kennen keine ES-Module, deshalb ist die Doppelung nicht
# aufloesbar — aber sie muss bewacht werden.
parity:
  stage: test
  image: node:22-alpine
  script:
    - node tools/check-parity.mjs

# Prueft die mitgelieferten Zabbix-Templates auf die Gruppen-UUID. Zwei von drei
# waren ohne sie unterwegs und wurden beim Import abgewiesen — waehrend
# INSTALL.md beide empfiehlt. Aufgefallen ist es erst einem Nutzer.
templates:
  stage: test
  image: node:22-alpine
  script:
    - node tools/check-templates.mjs

# Deutsche Texte, die im UI landen. Kommentare duerfen deutsch bleiben — das
# Gate liest nur String-Literale, mit eigenem Scanner statt grep (Regex mit
# Anfuehrungszeichen und Zeilenend-Kommentare brechen jede grep-Loesung).
i18n:
  stage: test
  image: node:22-alpine
  script:
    - node tools/check-i18n.mjs

# Prueft, was im Modul-ZIP landen wuerde. Liest die Ausschlussmuster aus
# deploy.sh, statt sie zu wiederholen — eine zweite Liste waere eine zweite
# Stelle, die auseinanderlaeuft. Anlass: nt-uninstall.sh rutschte ins Paket,
# weil die Liste nur die damals bekannten Skripte namentlich nannte.
package:
  stage: test
  image: node:22-alpine
  script:
    - node tools/check-package.mjs

# Prueft, was verschiedene Benutzer auf DERSELBEN Karte sehen: geteilte Ebene,
# persoenliche Abweichung pro Knoten, und wer in welche Ebene schreibt. Der
# eine Fehler, der hier schon auftrat (Super-Admin sah seine eigene geteilte
# Karte nicht), fiel erst im Betrieb auf.
layers:
  stage: test
  image: node:22-alpine
  script:
    - node tools/check-layers.mjs

# Der automatisierbare Teil des Clean-Install-Tests: Modul paketieren, ein
# echtes Zabbix 7.4 hochfahren, das Modul hineinmounten und pruefen, ob das
# Frontend ueberhaupt noch antwortet, ob der Code unter der PHP-Version des
# Zabbix-Images sauber ist, ob die Assets ueber den Web-Root kommen und ob im
# Log etwas steht.
#
# MANUELL, mit Absicht:
#   - Der Job braucht Docker-in-Docker. Ob der Runner das kann, weiss die
#     Pipeline nicht — ein Job, der daran scheitert, faerbt jede Pipeline rot
#     und niemand schaut mehr hin. Genau so verliert man ein Gate.
#   - Er faehrt zwei Container hoch und dauert Minuten, waehrend die uebrigen
#     elf Jobs in Sekunden durch sind.
#
# Aufruf: in der Pipeline auf "Play". Lokal geht er ohne alles:
#   tools/clean-install-test/smoke.sh
#
# Was er NICHT abdeckt (Aktivieren des Moduls, Rendern, Rechte, CSRF, 7.0),
# steht in tools/clean-install-test/README.md und in der Ausgabe des Skripts.
clean-install-smoke:
  stage: test
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash curl nodejs npm rsync
  script:
    - bash tools/clean-install-test/smoke.sh
  rules:
    - when: manual
  allow_failure: true
